format: 1
id: cad.editor.grips/one-undo-per-placement
feature: cad.editor.grips
intent: >-
  One grip placement is one undo step, however many commands it takes: a STRETCH copy (the
  objects copied in place, then the copy stretched) was two steps, and several hot grips
  stretched together one step each. Copies stay one step each, as in CAD, and the Undo option
  takes the last copy back whole; one Undo and one Redo take back and bring again several grips
  stretched together.
layer: gate
