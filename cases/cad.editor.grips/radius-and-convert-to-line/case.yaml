format: 1
id: cad.editor.grips/radius-and-convert-to-line
feature: cad.editor.grips
intent: >-
  The grip menu's options at an arc's midpoint and at a polyline arc segment's midpoint: Radius
  asks for the new radius ("** RADIUS **", measured from the centre), typed or picked, and keeps
  the centre and the ends' angles; Convert to Line changes the drawing at once, so grip.edit
  refuses it and the menu answers it at the prompt, where the segment becomes straight. Each is
  one undo step.
