format: 1
id: regressions/issue-focus-keys
feature: cad.editor.display-modes
intent: >-
  In Focus, where the command line is hidden, a letter picks its tool (the command line's type-to-command capture is
  off), Escape cancels the running command or clears the selection and stays in Focus, and only an Escape with nothing
  to cancel leaves Focus. The display-mode audit found typing in Focus going nowhere useful once the command
  line was hidden.
layer: gate
source:
  kind: probe
  from: kit display modes work (DM-cad, X2 and X3)
