format: 1
id: regressions/issue-4
feature: cad.file.drawings
intent: >-
  A reproducible build (the SDK's reproducible-ids feature, enabled in dev-dependencies only, and
  KITION_REPRODUCIBLE_IDS set, as the showcase and gating tests run) saves the same DXF bytes every
  time the same commands build the drawing: the replica's actor, whose slot numbers new handles,
  and the document id come from a counter in the process mixed with the seed. Before, the actor was
  random, so every handle and so the file differed on every save. SOURCE_DATE_EPOCH alone, which
  hosts pass to every kit, leaves actors random (two kit processes never mint the same handles),
  as do shipped builds and the web.
layer: gate
source:
  kind: issue
  from: Kition CAD regression suite
  license: owned
input: []
steps:
  - cargo-test: { package: "kition-cad-kit", test: "deterministic_save" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-17"
