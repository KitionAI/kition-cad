format: 1
id: regressions/issue-param-types
feature: cad.agent.act
intent: >-
  At least 95% of the parameter keys agents are offered say their type (kit requirement AX14). Keys
  added when commands began refusing unknown parameters (E7a) had no type, so 79 of 1040 keys (handles,
  points, constraint expressions, lengthen amounts) left an agent guessing; they are typed in
  bindings/wasm/agent-commands.json from what their handlers accept.
layer: gate
source:
  kind: probe
  from: "kit-matrix AX14 (cad: only 92% of parameter keys typed)"
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: "kition-cad-kit", test: "commands", filter: "parameter_keys_say_their_type" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-17"
