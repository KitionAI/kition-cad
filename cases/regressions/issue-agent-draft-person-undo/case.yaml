  from: bindings/wasm/src/collab.rs
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: "kition-cad-kit", filter: "an_agents_draft_merges_as_one_undo_step_of_the_person" }
expected:
  - actual: out:exit
    compare: exit
