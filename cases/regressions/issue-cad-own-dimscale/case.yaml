id: regressions/issue-cad-own-dimscale
feature: cad.dimension.styles
intent: >-
  Making a dimension style current, or editing the current one, sets only the scale the person's
  own new dimensions take: a colleague's dimension whose style's scale is 0 is drawn at the
  drawing's DIMSCALE and keeps its size, the replica and the saved file hold the drawing's
  DIMSCALE only, and SETVAR DIMSCALE still changes the drawing's.
