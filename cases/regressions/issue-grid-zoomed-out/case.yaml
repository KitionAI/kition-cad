format: 1
id: regressions/issue-grid-zoomed-out
feature: cad.editor.cursor
intent: >-
  Zoomed far out, the grid stays a grid. Before, the editor showed the grid the drawing was
  rendered with, shrunk with the drawing, so the paper turned grey, and outside the drawing's area
  there was none, so at 1% it was gone (walkthrough N17). The editor now gives its canvas colour,
  the drawing's pixels carry no grid at any zoom, and the editor draws the grid over its whole
  canvas at the size shown, its spacing times 5 until lines are 8 pixels apart; a render without
  that colour (a preview) keeps its grid, lines at least 8 pixels apart. The editor's side is
  checked in a browser by cad.editor.cursor/cursor-by-hand.
layer: gate
source:
  kind: issue
  from: CAD hand-drafting walkthrough 2026-11-25 (N17)
