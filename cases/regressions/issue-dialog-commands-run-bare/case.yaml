id: regressions/issue-dialog-commands-run-bare
feature: cad.editor.ribbon
intent: >-
  A ribbon or menu command whose title ends in "..." asks its parameters before it runs: Insert ›
  Block... opens its parameter dialog, and with the block's name and a point it inserts the block.
  Before, it ran with no parameters and failed ("`name` is required") in a red card; with the
  command line refusing INSERT (it may read a file), a block could not be inserted by hand at all
  (found by the stage 7 acceptance drawing).
