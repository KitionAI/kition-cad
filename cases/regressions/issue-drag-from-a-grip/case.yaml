feature: cad.editor.grips
intent: >-
  A press on a selected circle's grip dragged away and released makes the grip hot (the next click
  places it) and opens no selection window. Before, the drag opened a window from the grip and the
  release selected by it, so a person who tried to drag a grip lost the grip and the selection
  (walkthrough 别扭 4).
