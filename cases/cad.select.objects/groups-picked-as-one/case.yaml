format: 1
id: cad.select.objects/groups-picked-as-one
feature: cad.select.objects
intent: >-
  With group selection on (PICKSTYLE 1, the default) a click on a member of a selectable group
  selects the whole group, between commands and at "Select objects" (ERASE erases the group
  together); Shift+click takes the group out again; the rollover highlight shows the whole group;
  PICKSTYLE 0 or an unselectable group picks the member alone.
