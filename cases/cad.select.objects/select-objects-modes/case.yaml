format: 1
id: cad.select.objects/select-objects-modes
feature: cad.select.objects
intent: >-
  A "Select objects" prompt offers the selection modes the engine knows as its options: ALL,
  Last, Previous, Add and Remove, typed or clicked as before (ALL picks everything, r goes to
  Remove objects, Add and l take the last object back in). W, C, F, WP and CP, which the engine
  does not have, are not offered.
