feature: cad.select.objects
intent: >-
  Select Similar (the drawing menu's select.similar) selects every object shown in the space being
  edited that has the type and the layer of one of the selected objects; it changes only the
  selection (no undo step, the drawing stays clean, the command does not mutate), and with nothing
  selected it says to select an example first.
