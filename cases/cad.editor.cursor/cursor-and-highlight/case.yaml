format: 1
id: cad.editor.cursor/cursor-and-highlight
feature: cad.editor.cursor
intent: >-
  What the engine tells the editor about the cursor, driven through the tool events: its state
  (crosshair and pick box, crosshair, pick box, text) follows the prompt; the crosshair is at the
  pointer or on the snap holding it, as large as the pick box, and the readout is the point a click
  gives; the rollover highlight shows only where a click picks an object and not on a locked layer;
  the pick box is the pick range at any zoom; the selection window is filled by its direction;
  MOVE's line from the base point is a guide, LINE's rubber band is not; with the editor's canvas
  colour the drawing has no paper and no grid in its pixels, and colour 7 stands out.
layer: gate
source:
  kind: synthetic
  from: CAD hand-drafting stage 2 (bindings/wasm/src/cursor_tests.rs, crates/engine/engine/src/tests.rs)
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: "kition-cad-kit", filter: "cursor_tests::" }
  - cargo-test: { package: "kition-cad-engine", filter: "hover_picks_what_a_click_would_and_skips_locked_layers" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-26"
