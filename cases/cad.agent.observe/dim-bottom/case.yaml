format: 1
id: cad.agent.observe/dim-bottom
feature: cad.agent.observe
intent: >-
  The agent reads the geometry through the kit (entities) to find the rectangle's bottom edge and dimensions it with a horizontal linear dimension whose two points lie on that edge, leaving the drawing otherwise as it was.
layer: eval
source:
  kind: synthetic
  from: repo:conformance/basic.dxf
  license: Apache-2.0
  note: "A copy of the conformance drawing the cad engine writes: a 100 x 60 rectangle of four lines (handles 100-103) and a text, all on layer 0."
input: [input/plan.dxf]
steps:
  - task:
      prompt: >-
        In plan.dxf, add a horizontal linear dimension along the bottom edge of the rectangle, from
        one bottom corner to the other, placed a little below the edge. Change nothing else.
      max_turns: 20
  - run: { path: plan.dxf, args: { save: false }, steps: [{ command: entities, params: { type: Dimension } }], as: dims }
  - run: { path: plan.dxf, args: { save: false }, steps: [{ command: entities }], as: all }
expected:
  - actual: out:dims
    compare: values
    value:
      completed.0.result.count: 1
      completed.0.result.entities.0.geometry.kind.linear.rotation: 0
      completed.0.result.entities.0.geometry.p13.y: 0
      completed.0.result.entities.0.geometry.p14.y: 0
  - actual: out:all
    compare: values
    collateral: true
    value:
      completed.0.result.count: 6
solution:
  - tool: cad_run
    args: { path: plan.dxf, steps: [{ command: dimlinear, params: { p1: [0, 0], p2: [100, 0], at: [50, -10] } }] }
since: "2026-11-17"
timeout_s: 600
