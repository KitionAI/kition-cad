[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-cad"

[workspace.dependencies]
# kition-sdk, pinned by commit (one revision for every crate of it)
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's end-to-end tests.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-env = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
# internal
kition-cad-geom = { path = "crates/support/geom" }
kition-cad-dxf = { path = "crates/formats/dxf" }
kition-cad-dwg = { path = "crates/formats/dwg" }
kition-cad-color = { path = "crates/support/color" }
kition-cad-doc = { path = "crates/engine/doc" }
kition-cad-constraints = { path = "crates/engine/constraints" }
kition-cad-fonts = { path = "crates/support/fonts" }
kition-cad-render = { path = "crates/render/render" }
kition-cad-io = { path = "crates/formats/io" }
kition-cad-engine = { path = "crates/engine/engine" }
kdm-model = { path = "crates/kdm/kdm-model" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"

# rendering / formats
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
skrifa = "0.47"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Debug info: line tables for the kit's crates (backtraces keep file and line) and none for
# dependencies. Full debug info in every test binary of `cargo test --workspace` filled a GitHub
# runner's disk.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
